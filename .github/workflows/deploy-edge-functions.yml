name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy verify-payment
        run: supabase functions deploy verify-payment --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy use-credit
        run: supabase functions deploy use-credit --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy calculate-daily-rewards
        # --no-verify-jwt: pg_cron calls this function via pg_net.http_post()
        # without an auth header; verifying JWT here would 401-block it.
        # The function only does idempotent DB calculation (delete + insert
        # on reward_pool_distribution) — no payment, no user-mutating action.
        # Stronger auth (X-Cron-Secret header) is planned in Sprint 4.
        run: supabase functions deploy calculate-daily-rewards --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy submit-score
        # Anti-cheat gate in front of the submit_score RPC. JWT verification
        # stays on (default) so only callers with a valid Supabase anon key
        # can hit it — the frontend already includes one in its Supabase
        # client. Internal validation logic lives in the function body.
        run: supabase functions deploy submit-score --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy reconcile-payments
        # Self-healing payment reconciliation (Sprint 4.5). Triggered by
        # pg_cron every 15 min via pg_net.http_post with the service role
        # key in the Authorization header. JWT verification stays on
        # (default) — service role tokens are valid JWTs — and the
        # function additionally checks the bearer matches the configured
        # SUPABASE_SERVICE_ROLE_KEY before touching anything.
        run: supabase functions deploy reconcile-payments --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy get-token-price
        # Server-side price proxy. The frontend's client-side chain
        # (DexScreener + Jupiter) fails when (a) the token is still on
        # the pump.fun bonding curve and no aggregator has indexed it,
        # or (b) a mobile carrier / corporate proxy DNS-blocks the
        # crypto-data domains. *.supabase.co stays reachable, so the
        # frontend falls back here. JWT verification stays on (default)
        # — the function is anon-key gated to keep it from being a
        # free public price oracle.
        run: supabase functions deploy get-token-price --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
