name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy verify-payment
        run: supabase functions deploy verify-payment --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy use-credit
        run: supabase functions deploy use-credit --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy calculate-daily-rewards
        # --no-verify-jwt: pg_cron calls this function via pg_net.http_post()
        # without an auth header; verifying JWT here would 401-block it.
        # The function only does idempotent DB calculation (delete + insert
        # on reward_pool_distribution) — no payment, no user-mutating action.
        # Stronger auth (X-Cron-Secret header) is planned in Sprint 4.
        run: supabase functions deploy calculate-daily-rewards --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
